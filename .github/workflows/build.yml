name: 自动打包 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装编译组件并同意协议
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 手动安装 Gradle 8.2（不依赖 wrapper）
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          ./gradle-8.2/bin/gradle --version

      - name: 编译 Debug 版 APK（自带签名，可直接安装到手机）
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          ./gradle-8.2/bin/gradle assembleDebug

      - name: 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: 白银小帮手-APK
          path: app/build/outputs/apk/debug/app-debug.apk

